<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<title>sentri.az video overlay</title>
<link rel="stylesheet" href="brand.css">
<style>
  /* Transparent title block laid over real footage (see scripts/screen_replace.py) */
  html, body { background: transparent; }
  .frame { position: relative; width: 1080px; height: 1920px; }
  .top { position: absolute; top: 120px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; text-align: center; text-shadow: 0 4px 24px rgba(0, 0, 0, 0.55); }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 32px; color: rgba(255, 255, 255, 0.85); }
  .brand .logo { width: 50px; height: 50px; filter: drop-shadow(0 3px 10px rgba(0, 0, 0, 0.5)); }
  h1 { font-size: 84px; font-weight: 700; margin-top: 26px; line-height: 1.05; }
  .tags { display: flex; gap: 18px; margin-top: 28px; }
  .tags span { padding: 12px 30px; border-radius: 40px; font-size: 34px; font-weight: 600; color: var(--accent); background: rgba(5, 20, 60, 0.45); border: 2px solid rgba(255, 209, 102, 0.75); text-shadow: none; }
</style>
</head>
<body>
<div id="root"></div>
<script src="common.js"></script>
<script>
loadData().then((d) => {
  const f = el("div", "frame");
  const top = el("div", "top");
  top.append(el("div", "brand", LOGO + BRAND.handle), el("h1", null, rich(d.title)),
    el("div", "tags", (d.tags || []).map((t) => `<span>${rich(t)}</span>`).join("")));
  f.append(top);
  document.getElementById("root").append(f);
  return document.fonts.ready;
}).then(() => { window.READY = true; });
</script>
</body>
</html>
