<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<title>sentri.az reel</title>
<link rel="stylesheet" href="brand.css">
<style>
  html, body { background: #000; }
  .canvas { width: 1080px; height: 1920px; --glow-y: 30%; }
  .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 300px 70px 200px; text-align: center; }

  .brandbar { position: absolute; top: 140px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 14px; font-size: 30px; color: var(--muted); z-index: 5; }
  .brandbar .logo { width: 46px; height: 46px; opacity: 0.9; }

  .badge { display: inline-flex; align-items: center; gap: 12px; padding: 12px 28px; border-radius: 40px; background: rgba(245, 165, 36, 0.16); border: 2px solid rgba(245, 165, 36, 0.55); color: var(--orange); font-weight: 700; font-size: 26px; letter-spacing: 2px; text-transform: uppercase; margin-top: 60px; }
  .title { font-weight: 700; font-size: 66px; line-height: 1.22; margin-top: 56px; }
  .subtitle { font-size: 38px; line-height: 1.45; color: #dce5f7; margin-top: 40px; }
  .hook { justify-content: flex-start; padding-top: 440px; }
  .hook .title { font-size: 64px; }

  /* Email mock */
  .mail { width: 940px; text-align: left; background: #1f3462; border: 2px solid var(--card-line); border-radius: 22px; overflow: hidden; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35); transform-origin: top center; }
  .mail-head { display: flex; gap: 22px; align-items: center; padding: 26px 34px; background: rgba(255, 255, 255, 0.04); border-bottom: 2px solid var(--card-line); }
  .avatar { width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--blue); display: grid; place-items: center; font-weight: 700; font-size: 30px; color: var(--blue-soft); flex: none; }
  .from { font-weight: 600; font-size: 32px; line-height: 1.2; }
  .mail-body { padding: 30px 34px 36px; display: grid; gap: 22px; justify-items: start; }
  .subject { font-weight: 700; font-size: 44px; line-height: 1.2; }
  .text { font-size: 30px; line-height: 1.4; color: #d5def0; }
  .attach { display: inline-flex; gap: 12px; align-items: center; font-size: 28px; padding: 10px 18px; border: 2px solid var(--card-line); border-radius: 10px; }
  .btn { background: var(--blue); color: #fff; font-weight: 700; font-size: 30px; padding: 16px 30px; border-radius: 12px; }
  .link { font-family: "DejaVu Sans Mono", monospace; font-size: 24px; line-height: 1.45; color: #9fb0cf; }
  .link .bad { color: #ff8a95; }
  .hl { position: relative; border-radius: 8px; }
  .hl::after { content: ""; position: absolute; inset: -8px -10px; border: 3px solid var(--red); border-radius: 10px; opacity: var(--hl, 0); box-shadow: 0 0 24px rgba(255, 77, 94, calc(var(--hl, 0) * 0.6)); }
  .caption { font-size: 40px; color: #dce5f7; margin-top: 50px; }

  .callout { position: absolute; left: 70px; right: 70px; top: 1240px; display: flex; gap: 28px; text-align: left; padding: 36px 40px; border-radius: 22px; background: var(--card); border: 2px solid var(--card-line); }
  .num { flex: none; width: 66px; height: 66px; border-radius: 50%; background: var(--red); display: grid; place-items: center; font-weight: 700; font-size: 34px; }
  .callout h3 { font-size: 44px; font-weight: 700; margin-bottom: 10px; }
  .callout p { font-size: 32px; line-height: 1.4; color: #d5def0; }

  /* Stat / network */
  .big { font-weight: 800; font-size: 190px; line-height: 1; color: var(--red); margin-top: 40px; letter-spacing: 2px; }
  .net { width: 640px; height: 640px; margin-top: 40px; }
  .net line { stroke: rgba(143, 182, 255, 0.25); stroke-width: 4; }
  .net line.hot { stroke: var(--red); }
  .net circle.node { fill: #142a52; stroke: rgba(143, 182, 255, 0.4); stroke-width: 4; }
  .net circle.dot { fill: var(--red); }

  /* List */
  .items { display: grid; gap: 30px; margin-top: 70px; width: 100%; }
  .item { display: flex; gap: 28px; align-items: center; text-align: left; padding: 30px 36px; border-radius: 22px; background: var(--card); border: 2px solid var(--card-line); font-size: 36px; line-height: 1.35; }
  .item .num { background: var(--blue); }

  /* Package (pricing card) */
  .rings { position: absolute; top: 210px; right: -40px; width: 420px; height: 420px; }
  .rings circle { fill: none; stroke: var(--blue); stroke-width: 10; opacity: 0.55; }
  .pkg-head { font-size: 40px; color: var(--muted); margin-top: 40px; }
  .pkg { position: relative; width: 900px; margin-top: 50px; text-align: left; padding: 60px 60px 70px; border-radius: 36px; background: linear-gradient(150deg, #2a5fd6 0%, #1a3a86 55%, #142a5e 100%); border: 2px solid rgba(143, 182, 255, 0.35); box-shadow: 0 40px 100px rgba(0, 0, 0, 0.45); }
  .pkg.featured { background: linear-gradient(150deg, #3b4fd8 0%, #2a2f8f 55%, #1b1f5e 100%); border-color: rgba(245, 165, 36, 0.6); }
  .pkg h2 { font-size: 76px; font-weight: 800; color: var(--orange); line-height: 1.05; }
  .pkg .what { font-size: 38px; margin-top: 10px; color: #e6edfb; }
  .pkg .price { font-size: 110px; font-weight: 800; margin-top: 26px; line-height: 1; }
  .pkg .price small { font-size: 44px; font-weight: 600; color: var(--muted); margin-left: 8px; }
  .pkg ul { list-style: none; display: grid; gap: 22px; margin-top: 44px; }
  .pkg li { display: flex; gap: 22px; align-items: center; font-size: 38px; }
  .tick { flex: none; width: 48px; height: 48px; border-radius: 50%; background: rgba(255, 255, 255, 0.92); display: grid; place-items: center; }
  .tick svg { width: 30px; height: 30px; stroke: #1a3a86; fill: none; stroke-width: 3.5; }
  .ribbon { position: absolute; right: 40px; top: -28px; background: var(--red); color: #fff; font-weight: 800; font-size: 30px; letter-spacing: 1px; text-transform: uppercase; padding: 14px 30px; border-radius: 10px; box-shadow: 0 12px 30px rgba(255, 77, 94, 0.45); }
  .pkg.featured .ribbon { background: var(--orange); color: #1b1f5e; box-shadow: 0 12px 30px rgba(245, 165, 36, 0.45); }
  .pkg-note { font-size: 30px; color: var(--muted); margin-top: 40px; }

  /* Browser mock: a website building itself */
  .browser { width: 940px; margin-top: 60px; border-radius: 26px; overflow: hidden; background: #f4f7ff; text-align: left; box-shadow: 0 40px 100px rgba(0, 0, 0, 0.45); }
  .bar { display: flex; align-items: center; gap: 14px; padding: 22px 26px; background: #dde5f5; }
  .bar i { width: 20px; height: 20px; border-radius: 50%; background: #ff5f57; }
  .bar i:nth-child(2) { background: #febc2e; }
  .bar i:nth-child(3) { background: #28c840; }
  .url { flex: 1; margin-left: 16px; background: #fff; border-radius: 30px; padding: 12px 26px; font-size: 30px; color: #1b2a4a; display: flex; gap: 12px; align-items: center; min-height: 58px; }
  .url .lock { color: #1f9d55; font-size: 26px; }
  .caret { display: inline-block; width: 3px; height: 34px; background: #1b2a4a; vertical-align: middle; }
  .page { padding: 34px; display: grid; gap: 26px; height: 760px; align-content: start; }
  .nav { display: flex; justify-content: space-between; align-items: center; }
  .nav b { width: 170px; height: 34px; border-radius: 8px; background: #1a3a86; }
  .nav span { display: flex; gap: 18px; }
  .nav span i { width: 90px; height: 18px; border-radius: 9px; background: #c3cee6; }
  .heroblock { border-radius: 20px; padding: 46px 40px; background: linear-gradient(135deg, #2a5fd6, #142a5e); display: grid; gap: 20px; }
  .heroblock i { height: 30px; border-radius: 10px; background: rgba(255, 255, 255, 0.9); }
  .heroblock i:nth-child(2) { width: 70%; background: rgba(255, 255, 255, 0.6); }
  .heroblock em { width: 230px; height: 64px; border-radius: 32px; background: var(--orange); }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .cards i { height: 220px; border-radius: 18px; background: #fff; box-shadow: 0 8px 24px rgba(26, 58, 134, 0.15); border-top: 10px solid var(--blue); }
  .badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; margin-top: 56px; }
  .badges span { font-size: 32px; padding: 14px 28px; border-radius: 40px; background: var(--card); border: 2px solid var(--card-line); }

  /* CTA */
  .cta { justify-content: center; padding-top: 0; }
  .shield { width: 190px; height: 220px; }
  .cta .title { font-size: 72px; margin-top: 50px; }
  .pill { margin-top: 50px; background: var(--blue); color: #0b1530; font-weight: 700; font-size: 38px; padding: 26px 50px; border-radius: 60px; }
  .cta .logo { width: 110px; height: 110px; margin-top: 80px; }
  .wordmark { font-size: 64px; letter-spacing: 14px; font-weight: 500; margin-top: 30px; }
  .tag { font-size: 34px; color: var(--muted); margin-top: 14px; }
  .rule { width: 260px; height: 2px; background: var(--muted); opacity: 0.5; margin: 40px 0; }
  .contact { font-size: 44px; display: flex; gap: 22px; align-items: center; margin-top: 18px; }
  .contact svg { width: 50px; height: 50px; stroke: var(--blue); fill: none; stroke-width: 1.8; }
</style>
</head>
<body>
<div id="root"></div>
<script src="common.js"></script>
<script>
const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const prog = (t, start, dur = 0.5) => ease((t - start) / dur);
function show(node, p, dy = 40, scale = 0) {
  node.style.opacity = p;
  node.style.transform = `translateY(${(1 - p) * dy}px) scale(${1 - (1 - p) * scale})`;
}

const SHIELD = '<svg class="shield" viewBox="0 0 100 116"><path d="M50 4 94 26v38c0 22-20 40-44 48C26 104 6 86 6 64V26z" fill="rgba(68,139,255,0.18)" stroke="#448bff" stroke-width="4"/><path d="m30 60 14 14 28-30" fill="none" stroke="#8fb6ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const GLOBE = '<svg class="shield" viewBox="0 0 100 116"><circle cx="50" cy="58" r="44" fill="rgba(68,139,255,0.18)" stroke="#448bff" stroke-width="4"/><ellipse cx="50" cy="58" rx="18" ry="44" fill="none" stroke="#8fb6ff" stroke-width="4"/><path d="M6 58h88M12 36h76M12 80h76" stroke="#8fb6ff" stroke-width="4" fill="none"/></svg>';
const ICON_MAIL = '<svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="m3 6 9 7 9-7"/></svg>';
const ICON_PHONE = '<svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M10 18.5h4"/></svg>';
const ICON_FILE = '<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h8l4 4v16H6z"/><path d="M14 2v4h4"/></svg>';

// Each scene type: build(data) -> { node, duration, update(localTime) }
const SCENES = {
  hook(d) {
    const node = el("div", "scene hook");
    const badge = d.badge ? el("div", "badge", "⚠ " + rich(d.badge)) : null;
    const title = el("div", "title", rich(d.title));
    const sub = d.subtitle ? el("div", "subtitle", rich(d.subtitle)) : null;
    [badge, title, sub].forEach((n) => n && node.append(n));
    return {
      node, duration: d.duration ?? 3.5,
      update(t) {
        badge && show(badge, prog(t, 0.15));
        show(title, prog(t, 0.45, 0.6), 30, 0.05);
        sub && show(sub, prog(t, 1.3));
      },
    };
  },

  email(d) {
    const node = el("div", "scene");
    const hlKeys = new Set((d.callouts || []).flatMap((c) => [].concat(c.highlight || [])));
    const part = (key, tag, cls, html) => el(tag, cls + (hlKeys.has(key) ? " hl" : ""), html);
    const mail = el("div", "mail");
    const head = el("div", "mail-head");
    head.append(el("div", "avatar", (d.from || "?").trim()[0]));
    const who = el("div");
    who.append(el("div", "from", rich(d.from)));
    who.append(part("address", "div", "text", rich(d.address)));
    head.append(who);
    const body = el("div", "mail-body");
    const fields = {
      subject: part("subject", "div", "subject", rich(d.subject)),
      body: part("body", "div", "text", rich(d.body)),
      attachment: d.attachment ? part("attachment", "div", "attach", ICON_FILE + rich(d.attachment)) : null,
      button: d.button ? part("button", "div", "btn", rich(d.button)) : null,
      link: d.link ? part("link", "div", "link", rich(d.link).replace(/\[(.+?)\]/g, '<span class="bad">$1</span>')) : null,
    };
    Object.values(fields).forEach((n) => n && body.append(n));
    fields.address = who.lastChild;
    mail.append(head, body);
    const caption = d.caption ? el("div", "caption", rich(d.caption)) : null;
    node.append(mail);
    caption && node.append(caption);

    const intro = d.intro ?? 3;
    const step = d.calloutDuration ?? 3.4;
    const callouts = (d.callouts || []).map((c, i) => {
      const box = el("div", "callout", `<div class="num">${i + 1}</div><div><h3>${rich(c.title)}</h3><p>${rich(c.text)}</p></div>`);
      node.append(box);
      return { box, keys: [].concat(c.highlight || []), start: intro + i * step };
    });
    return {
      node, duration: d.duration ?? intro + callouts.length * step + 0.4,
      update(t) {
        show(mail, prog(t, 0.1, 0.6), 60, 0.04);
        const shrink = callouts.length ? prog(t, intro - 0.4, 0.6) : 0;
        mail.style.transform += ` translateY(${shrink * -60}px) scale(${1 - shrink * 0.12})`;
        caption && (caption.style.opacity = prog(t, 1.2) * (1 - shrink));
        Object.values(fields).forEach((f) => f && f.style.setProperty("--hl", 0));
        callouts.forEach((c, i) => {
          const end = i === callouts.length - 1 ? Infinity : c.start + step;
          const p = prog(t, c.start, 0.45) * (1 - prog(t, end - 0.3, 0.3));
          show(c.box, p, 50);
          const pulse = 0.75 + 0.25 * Math.sin((t - c.start) * 6);
          c.keys.forEach((k) => fields[k]?.style.setProperty("--hl", p * pulse));
        });
      },
    };
  },

  stat(d) {
    const node = el("div", "scene");
    const big = el("div", "big", rich(d.big));
    const n = d.nodes ?? 6, R = 250, C = 320;
    const pts = Array.from({ length: n }, (_, i) => {
      const a = -Math.PI / 2 + (i * 2 * Math.PI) / n;
      return [C + R * Math.cos(a), C + R * Math.sin(a)];
    });
    const svg = `<svg class="net" viewBox="0 0 640 640">
      ${pts.map(([x, y]) => `<line x1="${C}" y1="${C}" x2="${x}" y2="${y}"/><line class="hot" x1="${C}" y1="${C}" x2="${x}" y2="${y}" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>`).join("")}
      <circle class="node" cx="${C}" cy="${C}" r="40"/><circle class="dot" cx="${C}" cy="${C}" r="14"/>
      ${pts.map(([x, y]) => `<circle class="node" cx="${x}" cy="${y}" r="32"/><circle class="dot outer" cx="${x}" cy="${y}" r="12"/>`).join("")}
    </svg>`;
    const net = el("div", null, svg);
    const caption = el("div", "subtitle", rich(d.caption));
    node.append(big, net, caption);
    const hot = net.querySelectorAll("line.hot"), dots = net.querySelectorAll("circle.dot.outer");
    const centre = net.querySelectorAll("circle.dot")[0];
    return {
      node, duration: d.duration ?? 5,
      update(t) {
        show(big, prog(t, 0.1, 0.5), 0, 0.3);
        show(net, prog(t, 0.4));
        centre.style.opacity = prog(t, 0.9, 0.3);
        hot.forEach((l, i) => {
          const p = prog(t, 1.1 + i * 0.25, 0.5);
          l.style.strokeDashoffset = 1 - p;
          dots[i].style.opacity = prog(t, 1.5 + i * 0.25, 0.2);
        });
        show(caption, prog(t, 1.3 + n * 0.25));
      },
    };
  },

  list(d) {
    const node = el("div", "scene");
    const title = el("div", "title", rich(d.title));
    const items = el("div", "items");
    const rows = (d.items || []).map((txt, i) => {
      const r = el("div", "item", `<div class="num">${i + 1}</div><div>${rich(txt)}</div>`);
      items.append(r);
      return r;
    });
    node.append(title, items);
    const step = d.itemDuration ?? 1.6;
    return {
      node, duration: d.duration ?? 1.4 + rows.length * step + 1.2,
      update(t) {
        show(title, prog(t, 0.15));
        rows.forEach((r, i) => {
          const p = prog(t, 1 + i * step);
          r.style.opacity = p;
          r.style.transform = `translateX(${(1 - p) * -80}px)`;
        });
      },
    };
  },

  text(d) {
    const node = el("div", "scene");
    node.style.justifyContent = "center";
    node.style.paddingTop = "0";
    const title = el("div", "title", rich(d.title));
    title.style.fontSize = (d.size ?? 80) + "px";
    const sub = d.subtitle ? el("div", "subtitle", rich(d.subtitle)) : null;
    node.append(title);
    sub && node.append(sub);
    return {
      node, duration: d.duration ?? 3,
      update(t) {
        show(title, prog(t, 0.15, 0.6), 30, 0.05);
        sub && show(sub, prog(t, 0.9));
      },
    };
  },

  package(d) {
    const node = el("div", "scene");
    node.append(el("div", null, '<svg class="rings" viewBox="0 0 420 420"><circle cx="210" cy="210" r="190"/><circle cx="210" cy="210" r="160"/><circle cx="210" cy="210" r="130"/></svg>'));
    const head = d.heading ? el("div", "pkg-head", rich(d.heading)) : null;
    const card = el("div", "pkg" + (d.featured ? " featured" : ""));
    card.append(el("h2", null, rich(d.name)));
    if (d.what) card.append(el("div", "what", rich(d.what)));
    const price = el("div", "price");
    card.append(price);
    const ul = el("ul");
    const rows = (d.features || []).map((f) => {
      const li = el("li", null, `<span class="tick"><svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg></span><span>${rich(f)}</span>`);
      ul.append(li);
      return li;
    });
    card.append(ul);
    const ribbon = d.ribbon ? el("div", "ribbon", rich(d.ribbon)) : null;
    ribbon && card.append(ribbon);
    const note = d.note ? el("div", "pkg-note", rich(d.note)) : null;
    [head, card, note].forEach((n) => n && node.append(n));
    const rings = node.querySelector(".rings");
    const step = 0.3;
    return {
      node, duration: d.duration ?? 2.6 + rows.length * step + 1,
      update(t) {
        head && show(head, prog(t, 0.05));
        const p = prog(t, 0.1, 0.6);
        card.style.opacity = p;
        card.style.transform = `translateX(${(1 - p) * 300}px) rotate(${(1 - p) * 6}deg)`;
        rings.style.transform = `rotate(${t * 25}deg)`;
        rings.style.opacity = prog(t, 0.3);
        // Price counts up to its final value
        const value = Number(d.price) || 0;
        const shown = Math.round(value * prog(t, 0.6, 0.9));
        price.innerHTML = (d.prefix ? `<small>${rich(d.prefix)}</small> ` : "") + shown + `<small>${rich(d.currency ?? "AZN")}</small>`;
        rows.forEach((r, i) => {
          const q = prog(t, 1.3 + i * step, 0.35);
          r.style.opacity = q;
          r.style.transform = `translateX(${(1 - q) * 40}px)`;
        });
        if (ribbon) {
          const q = prog(t, 1.4 + rows.length * step, 0.35);
          ribbon.style.opacity = q;
          ribbon.style.transform = `scale(${0.6 + 0.4 * q}) rotate(-4deg)`;
        }
        note && show(note, prog(t, 1.6 + rows.length * step));
      },
    };
  },

  browser(d) {
    const node = el("div", "scene");
    const title = el("div", "title", rich(d.title));
    const win = el("div", "browser");
    win.innerHTML = `<div class="bar"><i></i><i></i><i></i><div class="url"><span class="lock">🔒</span><span class="typed"></span><span class="caret"></span></div></div>
      <div class="page">
        <div class="nav"><b></b><span><i></i><i></i><i></i></span></div>
        <div class="heroblock"><i></i><i></i><em></em></div>
        <div class="cards"><i></i><i></i><i></i></div>
      </div>`;
    const badges = el("div", "badges");
    const chips = (d.badges || []).map((b) => {
      const s = el("span", null, rich(b));
      badges.append(s);
      return s;
    });
    node.append(title, win, badges);
    const typed = win.querySelector(".typed"), caret = win.querySelector(".caret");
    const blocks = [...win.querySelectorAll(".nav, .heroblock, .cards i")];
    const url = d.url || "sizinbiznes.az";
    const typeEnd = 0.8 + url.length * 0.07;
    return {
      node, duration: d.duration ?? typeEnd + blocks.length * 0.3 + chips.length * 0.3 + 1.6,
      update(t) {
        show(title, prog(t, 0.05));
        show(win, prog(t, 0.2, 0.6), 60, 0.04);
        typed.textContent = url.slice(0, Math.max(0, Math.floor((t - 0.8) / 0.07)));
        caret.style.opacity = Math.floor(t * 2.5) % 2 ? 0 : 1;
        blocks.forEach((b, i) => show(b, prog(t, typeEnd + 0.2 + i * 0.3, 0.4), 30));
        chips.forEach((c, i) => show(c, prog(t, typeEnd + blocks.length * 0.3 + 0.3 + i * 0.3, 0.4), 20));
      },
    };
  },

  cta(d) {
    const node = el("div", "scene cta");
    const parts = [
      el("div", null, d.icon === "globe" ? GLOBE : SHIELD),
      el("div", "title", rich(d.title)),
      d.button ? el("div", "pill", rich(d.button)) : null,
      el("div", null, LOGO),
      el("div", "wordmark", BRAND.name),
      el("div", "tag", rich(d.tagline ?? BRAND.tagline)),
      el("div", "rule"),
      el("div", "contact", ICON_MAIL + (d.email ?? BRAND.email)),
      el("div", "contact", ICON_PHONE + (d.phone ?? BRAND.phone)),
    ].filter(Boolean);
    node.append(...parts);
    return {
      node, duration: d.duration ?? 5, brandbar: false,
      update(t) { parts.forEach((p, i) => show(p, prog(t, 0.1 + i * 0.18), 30)); },
    };
  },
};

const FADE = 0.35;
let timeline = [], total = 0, brandbar;

function seek(t) {
  for (const s of timeline) {
    const local = t - s.start;
    const active = local >= 0 && local < s.duration;
    s.node.style.display = active ? "" : "none";
    if (!active) continue;
    s.update(local);
    s.node.style.opacity = Math.min(prog(local, 0, FADE), 1 - prog(local, s.duration - FADE, FADE));
    brandbar.style.opacity = s.brandbar === false ? 1 - prog(local, 0, FADE) : 1;
  }
}

loadData().then((d) => {
  const canvas = el("div", "canvas");
  brandbar = el("div", "brandbar", LOGO + BRAND.handle);
  canvas.append(brandbar);
  for (const s of d.scenes) {
    if (!SCENES[s.type]) throw new Error("Unknown scene type: " + s.type);
    const scene = SCENES[s.type](s);
    scene.start = total;
    total += scene.duration;
    canvas.append(scene.node);
    timeline.push(scene);
  }
  document.getElementById("root").append(canvas);
  window.TOTAL = total;
  window.seek = seek;
  seek(0);
  return document.fonts.ready;
}).then(() => {
  window.READY = true;
  if (window.RENDER) return;
  // Browser preview: play in real time, click to restart
  let t0 = performance.now();
  document.body.onclick = () => (t0 = performance.now());
  const loop = (now) => { seek(((now - t0) / 1000) % total); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
});
</script>
</body>
</html>
