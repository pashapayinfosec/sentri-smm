<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<title>sentri.az post</title>
<link rel="stylesheet" href="brand.css">
<style>
  /* Sizes: post 1080x1350 (4:5 feed), square 1080x1080, story 1080x1920 */
  .canvas { width: 1080px; height: 1350px; padding: 96px 84px 72px; display: flex; flex-direction: column; --glow-y: 18%; }
  .canvas.square { height: 1080px; }
  .canvas.story { height: 1920px; padding-top: 200px; padding-bottom: 220px; }

  .hero { position: absolute; inset: 0; background-size: cover; background-position: center bottom; }
  .hero::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, var(--bg) 0%, rgba(5, 32, 107, 0.9) 45%, rgba(5, 32, 107, 0.15) 68%, rgba(5, 32, 107, 0.75) 100%);
  }

  .logo { width: 96px; height: 96px; }
  .top { display: flex; justify-content: flex-end; margin-bottom: 40px; }

  .eyebrow { font-weight: 600; font-size: 26px; letter-spacing: 3px; text-transform: uppercase; color: var(--blue-soft); margin-bottom: 18px; }
  h1 { font-weight: 800; font-size: 68px; line-height: 1.12; text-transform: uppercase; letter-spacing: 1px; }
  h1 .accent-orange { text-transform: none; letter-spacing: 0; }
  h1.normal-case { text-transform: none; }

  ul { list-style: none; margin-top: 54px; display: grid; gap: 22px; }
  li { font-size: 36px; line-height: 1.35; display: flex; gap: 18px; color: #e6edfb; }
  li::before { content: "✦"; color: var(--white); }
  /* In bullets, highlighted words are bold white like the reference posts, not yellow */
  li .accent-orange { color: var(--white); font-weight: 700; }
  .story h1 { font-size: 84px; }
  .story .eyebrow { font-size: 30px; }
  .story ul { gap: 34px; margin-top: 70px; }
  .story li { font-size: 44px; }
  .story .note { font-size: 34px; }

  .spacer { flex: 1; }

  .footer { display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; }
  .note { font-size: 30px; line-height: 1.4; max-width: 560px; }
  .note b { font-weight: 700; }
  .note::after { content: ""; display: block; width: 240px; height: 5px; border-radius: 3px; margin-top: 22px; background: linear-gradient(90deg, var(--white), rgba(255, 255, 255, 0)); }
  .contacts { font-size: 30px; display: grid; gap: 16px; text-align: right; white-space: nowrap; color: var(--muted); }
  .contacts .phone { font-size: 48px; font-weight: 500; color: var(--white); }
  .contacts span { display: inline-flex; align-items: center; gap: 12px; justify-content: flex-end; }
  .contacts svg { width: 34px; height: 34px; fill: var(--white); }
  /* "visual": "phone" -> 3D phone mockup on the right, text column narrowed */
  .with-visual h1, .with-visual .eyebrow, .with-visual ul { max-width: 600px; }
  .halo { position: absolute; right: -120px; bottom: 320px; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(circle, rgba(120, 180, 255, 0.55), rgba(40, 110, 255, 0.15) 45%, transparent 70%); }
  .device { position: absolute; right: -40px; bottom: 290px; width: 410px; height: 820px; padding: 16px; border-radius: 64px; transform: perspective(1600px) rotateY(-24deg) rotateZ(7deg); background: linear-gradient(145deg, #2a3358, #05070f 60%); box-shadow: 0 60px 120px rgba(0, 0, 0, 0.55), 0 0 140px rgba(90, 160, 255, 0.5), inset 0 0 0 3px rgba(255, 255, 255, 0.22); }
  .device .screen { position: relative; width: 100%; height: 100%; border-radius: 50px; overflow: hidden; padding: 110px 24px 0; background: radial-gradient(120% 80% at 30% 0%, #3b8cff, #0b3aa7 55%, #061a5c); }
  .device .island { position: absolute; top: 22px; left: 50%; width: 120px; height: 34px; margin-left: -60px; border-radius: 17px; background: #000; }
  .device .clock { font-size: 96px; font-weight: 300; text-align: center; line-height: 1; }
  .device .date { font-size: 24px; text-align: center; color: rgba(255, 255, 255, 0.8); margin: 10px 0 40px; }
  .device .note { max-width: none; font-size: 22px; line-height: 1.35; padding: 18px 20px; border-radius: 24px; background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.3); display: flex; gap: 14px; margin-bottom: 18px; }
  .device .note::after { display: none; }
  .device .app { flex: none; width: 46px; height: 46px; border-radius: 12px; background: #28c840; display: grid; place-items: center; font-size: 15px; font-weight: 700; }
  .device .note b { display: block; font-size: 23px; }
  .device .code { letter-spacing: 6px; font-weight: 700; color: var(--accent); }
  .device .call { position: absolute; left: 24px; right: 24px; bottom: 40px; padding: 26px 22px; border-radius: 30px; background: rgba(5, 20, 70, 0.6); border: 1px solid rgba(255, 255, 255, 0.25); text-align: center; }
  .device .call b { display: block; font-size: 28px; }
  .device .call span { font-size: 20px; color: rgba(255, 255, 255, 0.75); }
  .device .btns { display: flex; justify-content: space-around; margin-top: 22px; }
  .device .btns i { width: 76px; height: 76px; border-radius: 50%; background: #ff3b30; }
  .device .btns i + i { background: #28c840; }
</style>
</head>
<body>
<div id="root"></div>
<script src="common.js"></script>
<script>
const ICON_PHONE = '<svg viewBox="0 0 24 24"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg>';
const ICON_MAIL = '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>';

loadData().then((d) => {
  const c = el("div", "canvas " + (d.format || "post"));
  if (d.image) {
    const hero = el("div", "hero");
    hero.style.backgroundImage = `url("/${d.image}")`;
    c.append(hero);
  }
  if (d.visual === "phone") {
    c.classList.add("with-visual");
    c.append(el("div", "halo"));
    c.append(el("div", "device", `<div class="screen"><div class="island"></div>
      <div class="clock">09:41</div><div class="date">Cümə axşamı</div>
      <div class="note"><span class="app">SMS</span><span><b>Bank</b>Təsdiq kodu: <span class="code">48••</span><br>Kodu heç kimə deməyin.</span></div>
      <div class="call"><b>Naməlum nömrə</b><span>Gələn zəng…</span><div class="btns"><i></i><i></i></div></div></div>`));
  }
  c.append(el("div", "top", LOGO));
  // Without a photo, centre the text block in the free space
  if (!d.image) c.append(el("div", "spacer"));
  if (d.eyebrow) c.append(el("div", "eyebrow", rich(d.eyebrow)));
  const h1 = el("h1", d.uppercase === false ? "normal-case" : "", rich(d.headline));
  if (d.headlineSize) h1.style.fontSize = d.headlineSize + "px";
  c.append(h1);
  if (d.bullets?.length) {
    const ul = el("ul");
    d.bullets.forEach((b) => ul.append(el("li", null, `<span>${rich(b)}</span>`)));
    c.append(ul);
  }
  c.append(el("div", "spacer"));
  const footer = el("div", "footer");
  footer.append(el("div", "note", rich(d.footer || "").replace(/<span class="accent-orange">(.+?)<\/span>/g, "<b>$1</b>")));
  footer.append(el("div", "contacts",
    `<span class="phone">${ICON_PHONE}${d.phone || BRAND.phone}</span><span>${d.email || BRAND.email}</span>`));
  c.append(footer);
  document.getElementById("root").append(c);
  return document.fonts.ready;
}).then(() => { window.READY = true; });
</script>
</body>
</html>
